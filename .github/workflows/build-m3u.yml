name: Compilar APK M3U

on:
  workflow_dispatch:
  push:
    paths:
      - "MinhaIPTV_Android_M3U.zip"
      - ".github/workflows/build-m3u.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extrair o projeto M3U
        run: |
          test -f MinhaIPTV_Android_M3U.zip
          unzip -t MinhaIPTV_Android_M3U.zip
          unzip -q MinhaIPTV_Android_M3U.zip -d projeto

      - name: Compilar APK
        working-directory: projeto/MinhaIPTV_Android
        run: gradle --no-daemon assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: MinhaIPTV-M3U-debug
          path: projeto/MinhaIPTV_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
