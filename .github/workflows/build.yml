name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "MinhaIPTV_Android.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Conferir e extrair o projeto
        run: |
          test -f MinhaIPTV_Android.zip
          unzip -t MinhaIPTV_Android.zip
          unzip -q MinhaIPTV_Android.zip -d projeto

      - name: Corrigir import do Compose e alinhar JVM 17
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path("projeto/MinhaIPTV_Android/app/src/main/java/com/minhaiptv/app/MainActivity.kt")
          source_text = source.read_text()
          invalid_import = "import androidx.compose.foundation.layout.weight"
          source_lines = [line for line in source_text.splitlines() if line.strip() != invalid_import]
          source.write_text("\n".join(source_lines) + "\n")

          gradle_file = Path("projeto/MinhaIPTV_Android/app/build.gradle.kts")
          gradle_text = gradle_file.read_text()
          marker = "    buildFeatures {"
          if marker not in gradle_text:
              raise SystemExit("Não encontrei buildFeatures no Gradle do módulo app")
          if "sourceCompatibility = JavaVersion.VERSION_17" not in gradle_text:
              jvm_block = "\n".join([
                  "    compileOptions {",
                  "        sourceCompatibility = JavaVersion.VERSION_17",
                  "        targetCompatibility = JavaVersion.VERSION_17",
                  "    }",
                  "    kotlinOptions {",
                  '        jvmTarget = "17"',
                  "    }",
                  "",
              ])
              gradle_text = gradle_text.replace(marker, jvm_block + marker, 1)
              gradle_file.write_text(gradle_text)

          print("Ajustes do Compose e Java/Kotlin 17 aplicados")
          PY

      - name: Compilar APK de depuração
        working-directory: projeto/MinhaIPTV_Android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Guardar APK compilado
        uses: actions/upload-artifact@v4
        with:
          name: Max-Plus-TV-debug
          path: projeto/MinhaIPTV_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
