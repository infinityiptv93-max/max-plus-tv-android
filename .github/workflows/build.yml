name: Compilar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "MinhaIPTV_Android.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Preparar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Conferir e extrair o projeto
        run: |
          test -f MinhaIPTV_Android.zip
          unzip -t MinhaIPTV_Android.zip
          unzip -q MinhaIPTV_Android.zip -d projeto

      - name: Alinhar Java e Kotlin na JVM 17
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path("projeto/MinhaIPTV_Android/app/build.gradle.kts")
          text = file.read_text()
          marker = "    buildFeatures {"
          if marker not in text:
              raise SystemExit("Não encontrei buildFeatures no Gradle do módulo app")
          if "sourceCompatibility = JavaVersion.VERSION_17" not in text:
              block = '''    compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          '''
              text = text.replace(marker, block + marker, 1)
              file.write_text(text)
          print("Configuração Java/Kotlin alinhada em 17")
          PY

      - name: Compilar APK
        working-directory: projeto/MinhaIPTV_Android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Max-Plus-TV-debug
          path: projeto/MinhaIPTV_Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
